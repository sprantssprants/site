<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scrabble word checker | Ben Robinson</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
      background: #fff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }

    .banner {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      padding: clamp(18px, 2.6vw, 38px) clamp(16px, 3.6vw, 58px) 58px;
      background:
        radial-gradient(ellipse at 80% 30%, #719acb66, transparent 48%),
        linear-gradient(112deg, #030d29 0%, #0c2455 40%, #244b7a 72%, #06142e 100%);
    }
    .banner::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background-image:
        linear-gradient(#a9c5ef16 1px, transparent 1px),
        linear-gradient(90deg, #a9c5ef16 1px, transparent 1px);
      background-size: 16px 16px;
      mask-image: linear-gradient(90deg, #000, #0009 45%, transparent 88%);
      -webkit-mask-image: linear-gradient(90deg, #000, #0009 45%, transparent 88%);
    }
    .banner::after {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background:
        linear-gradient(173deg, #d5e6ff00 22%, #d5e6ff13 37%, #d5e6ff00 38%),
        linear-gradient(180deg, #91b8e733, transparent 4px, transparent 72%, #0005);
      box-shadow: inset 0 1px #afc9ed77;
    }
    .banner-inner {
      display: flex;
      align-items: center;
      gap: clamp(20px, 3vw, 48px);
    }
    .diagram-badge {
      display: block;
      flex: 0 0 auto;
      width: clamp(112px, 14vw, 184px);
      aspect-ratio: 1;
      padding: 3px;
      border: 1px solid #d0dcf1;
      border-radius: 50%;
      background:
        radial-gradient(ellipse at 31% 18%, #86b2e445, transparent 62%),
        linear-gradient(145deg, #224e7c, #06152f 70%);
      box-shadow:
        0 3px 5px #0008,
        inset 0 0 0 3px #0b1b38,
        inset 0 0 0 4px #a8c7ed66;
    }
    .cofibre-diagram {
      display: block;
      width: 100%;
      height: 100%;
      fill: #e4edff;
    }
    h1 {
      flex: 1;
      min-width: 0;
      margin: 0;
      padding-bottom: 6px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(44px, 7.2vw, 104px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.035em;
      color: #f3f6ff;
      text-shadow: 0 2px 1px #020917, 0 0 18px #a0c5ff45;
    }
    .banner h1 a { color: inherit; text-decoration: none; }
    .banner-photo {
      display: block;
      flex: 0 0 auto;
      align-self: flex-start;
      width: clamp(76px, 10vw, 124px);
      height: auto;
      margin-left: auto;
    }
    .banner-curve {
      position: absolute;
      left: 0;
      bottom: -1px;
      display: block;
      width: 100%;
      height: clamp(30px, 4vw, 58px);
      pointer-events: none;
    }

    .layout {
      display: grid;
      grid-template-columns: clamp(104px, 14vw, 210px) minmax(0, 1fr);
      gap: clamp(16px, 3vw, 48px);
      padding: 16px clamp(12px, 2.5vw, 40px) 32px;
      min-height: 64vh;
    }
    .sidebar {
      position: relative;
      overflow: hidden;
      min-height: 320px;
      border: 1px solid #072755;
      border-radius: 14px 3px 3px 14px;
      background:
        linear-gradient(102deg, #6d9fdb 0%, #226bb6 5%, #104f96 15%, #07376f 75%, #061e46 100%);
      box-shadow:
        inset 2px 2px 0 #b6d2f0aa,
        inset -3px -3px 0 #001b45,
        2px 2px 0 #dce3eb;
    }
    .sidebar a {
      position: relative;
      z-index: 1;
      display: block;
      padding: 18px 12px;
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      line-height: 1.4;
      text-decoration: none;
    }
    .sidebar a:hover { text-decoration: underline; }
    .sidebar a:focus-visible { outline: 2px solid white; outline-offset: -6px; }
    .sidebar::before, .sidebar::after { pointer-events: none; }
    .sidebar::before {
      content: "";
      position: absolute;
      inset: 5px;
      border: 1px solid #accded45;
      border-radius: 9px 0 0 9px;
    }
    .sidebar::after {
      content: "";
      position: absolute;
      inset: auto 8px 8px;
      height: 140px;
      background-image:
        linear-gradient(#b4d4ff38 1px, transparent 1px),
        linear-gradient(90deg, #b4d4ff38 1px, transparent 1px);
      background-size: 14px 14px;
      mask-image: linear-gradient(155deg, transparent 20%, #000);
      -webkit-mask-image: linear-gradient(155deg, transparent 20%, #000);
    }
    main { min-width: 0; background: #fff; }
    main p { margin: 0 0 1em; line-height: 1.5; }
    main h2 { margin: 0 0 16px; font-size: 24px; }
    .puzzle-photos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr));
      align-items: start;
      gap: 20px;
    }
    .puzzle-photos img { display: block; width: 100%; height: auto; }

    @media (max-width: 480px) {
      .banner { padding-bottom: 44px; }
      .banner-inner { gap: 10px; }
      .diagram-badge { width: clamp(56px, 16vw, 76px); }
      h1 { font-size: clamp(24px, 6.5vw, 32px); }
      .banner-photo { width: clamp(56px, 16vw, 76px); }
      .layout {
        grid-template-columns: 104px minmax(0, 1fr);
        gap: 14px;
        padding-top: 10px;
      }
      .sidebar { min-height: 360px; border-radius: 10px 2px 2px 10px; }
    }
    @media (max-width: 300px) {
      .banner-inner { gap: 8px; }
      .diagram-badge { width: 48px; }
      .banner-photo { width: 48px; }
      h1 { font-size: 23px; }
    }
    .word-finder input, .word-finder button { font-size: 16px; }
    .word-finder input { width: 16ch; max-width: 100%; min-width: 0; }
    .word-finder form { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 12px; }
    .word-finder #results h2 { font-size: 18px; margin: 1em 0 0.5em; }
  </style>
</head>

  </header>
  <div class="layout">
    <aside class="sidebar" aria-label="Sidebar">
      <a href="../Robinson_CDT_Project.pdf">Summer 2026 Project</a>
      <a href="../hobbies/index.html">Hobbies</a>
    </aside>
    <main>
      <section class="word-finder" aria-labelledby="word-finder-title">
        <h2 id="word-finder-title">Scrabble word checker</h2>
        <p>Up to 12 letters, including up to two ? blanks. CSW19 ∪ CSW24.</p>
        <form id="search-form">
          <label for="letters">Letters:</label>
          <input id="letters" name="letters" type="text" autocomplete="off"
            autocapitalize="characters" spellcheck="false" enterkeyhint="search"
            aria-describedby="help">
          <button type="submit">Find</button>
        </form>
        <p id="help">Press Enter to search. Bold letters use blanks.</p>
        <p id="status" role="status" aria-live="polite">Loading dictionary...</p>
        <div id="results"></div>
        <noscript><p>Please enable JavaScript to use the word finder.</p></noscript>
      </section>
    </main>
  </div>
  <script src="worker-bundle.js" defer></script>
  <script src="finder.js" defer></script>
